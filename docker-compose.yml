services:
  guest-portal:
    image: ghcr.io/ctrlaltspoods/unifi-neon-guest-portal:latest
    # To build from source instead of pulling, comment out "image" above and uncomment:
    # build: .
    container_name: neon-guest-portal
    restart: unless-stopped
    # UniFi sends guests to http://<portal-ip>/guest/s/<site>/ on port 80
    ports:
      - "80:80"
    # PORTAL_PASSWORD, PORTAL_TITLE and the UniFi settings come from .env
    env_file: .env
